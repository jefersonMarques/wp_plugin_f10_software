name: WordPress Review Package

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-review-package:
    if: github.head_ref == 'wordpress-review-prefix-fix'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Build and validate package
        run: python3 tools/build_wordpress_review_package.py

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: f10-captura-de-leads-v1.3.9-wordpress-org
          path: |
            build/f10-captura-de-leads-v1.3.9-wordpress-org.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
