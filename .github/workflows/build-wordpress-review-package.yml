name: Build WordPress Review Package

on:
  push:
    branches:
      - wordpress-review-prefix-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare version 1.3.9
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          excluded_roots = {'.git', '.github', 'build'}
          text_extensions = {'.php', '.js', '.css', '.txt', '.md', '.json', '.xml', '.yml', '.yaml'}
          text_domain = 'f10-captura-de-leads'
          placeholder = '__F10LECA_TEXT_DOMAIN__'

          def is_excluded(path: Path) -> bool:
              return bool(path.parts and path.parts[0] in excluded_roots)

          def replace_identifiers(value: str, protect_text_domain: bool = True) -> str:
              if protect_text_domain:
                  value = value.replace(text_domain, placeholder)

              replacements = (
                  ('F10_Lead_Capture_', 'F10LECA_'),
                  ('F10_Lead_Capture', 'F10LECA'),
                  ('F10_LEAD_CAPTURE_', 'F10LECA_'),
                  ('F10_LEAD_CAPTURE', 'F10LECA'),
                  ('F10Lead', 'F10LECA'),
                  ('f10_lead_capture_', 'f10leca_'),
                  ('f10_lead_capture', 'f10leca'),
                  ('f10-lead-capture', 'f10leca'),
                  ('f10_', 'f10leca_'),
                  ('f10-', 'f10leca-'),
              )

              for source, target in replacements:
                  value = value.replace(source, target)

              if protect_text_domain:
                  value = value.replace(placeholder, text_domain)

              return value

          text_files = [
              path
              for path in root.rglob('*')
              if path.is_file() and not is_excluded(path) and path.suffix.lower() in text_extensions
          ]

          for path in text_files:
              original = path.read_text(encoding='utf-8')
              updated = replace_identifiers(original)

              updated = re.sub(
                  r'(?m)^(\s*\*\s*Version:\s*)1\.3\.8\s*$',
                  r'\g<1>1.3.9',
                  updated,
              )
              updated = updated.replace(
                  "define('F10LECA_VERSION', '1.3.8');",
                  "define('F10LECA_VERSION', '1.3.9');",
              )
              updated = re.sub(
                  r'(?m)^(Stable tag:\s*)1\.3\.8\s*$',
                  r'\g<1>1.3.9',
                  updated,
              )

              if path.name == 'readme.txt' and '= 1.3.9 =' not in updated:
                  marker = '== Changelog ==\n\n'
                  changelog = (
                      '= 1.3.9 =\n\n'
                      '* Replaces short global identifiers with the unique f10leca/F10LECA prefix.\n'
                      '* Updates classes, constants, hooks, AJAX actions, shortcodes, options, transients, menus and asset handles.\n'
                      '* Keeps the assigned f10-captura-de-leads text domain and plugin slug unchanged.\n\n'
                  )
                  if marker not in updated:
                      raise RuntimeError('The readme changelog marker was not found.')
                  updated = updated.replace(marker, marker + changelog, 1)

              if updated != original:
                  path.write_text(updated, encoding='utf-8', newline='\n')

          paths = sorted(
              [path for path in root.rglob('*') if not is_excluded(path)],
              key=lambda path: (len(path.parts), len(str(path))),
              reverse=True,
          )

          for path in paths:
              if not path.exists():
                  continue

              new_name = path.name
              if new_name != text_domain:
                  new_name = replace_identifiers(new_name, protect_text_domain=False)

              if new_name == path.name:
                  continue

              destination = path.with_name(new_name)
              if destination.exists():
                  raise RuntimeError(f'Cannot rename {path} to {destination}: destination exists.')
              path.rename(destination)

          plugin_headers = []
          for path in root.glob('*.php'):
              content = path.read_text(encoding='utf-8')
              if 'Plugin Name: F10 Lead Capture' in content:
                  plugin_headers.append(path)

          if len(plugin_headers) != 1:
              raise RuntimeError(f'Expected one root plugin file, found {len(plugin_headers)}.')

          plugin_file = plugin_headers[0]
          plugin_content = plugin_file.read_text(encoding='utf-8')
          required_header_values = (
              'Version: 1.3.9',
              'Text Domain: f10-captura-de-leads',
              "define('F10LECA_VERSION', '1.3.9');",
          )
          for required_value in required_header_values:
              if required_value not in plugin_content:
                  raise RuntimeError(f'Missing expected plugin value: {required_value}')

          required_paths = re.findall(
              r"require_once\s+F10LECA_PATH\s*\.\s*'([^']+)'",
              plugin_content,
          )
          missing_paths = [path for path in required_paths if not (root / path).is_file()]
          if missing_paths:
              raise RuntimeError(f'Missing required files after renaming: {missing_paths}')

          print(f'Prepared plugin entry point: {plugin_file}')
          PY

      - name: Validate unique prefixes
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          excluded_roots = {'.git', '.github', 'build'}
          text_extensions = {'.php', '.js', '.css', '.txt', '.md', '.json', '.xml'}
          forbidden_patterns = {
              'legacy class prefix': re.compile(r'\bF10_Lead_Capture'),
              'legacy constant prefix': re.compile(r'\bF10_LEAD_CAPTURE'),
              'legacy JavaScript prefix': re.compile(r'\bF10Lead'),
              'short underscore prefix': re.compile(r'\bf10_'),
              'short dash prefix': re.compile(r'\bf10-(?!captura-de-leads\b)'),
          }

          violations = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_extensions:
                  continue
              if path.parts and path.parts[0] in excluded_roots:
                  continue

              content = path.read_text(encoding='utf-8')
              for label, pattern in forbidden_patterns.items():
                  for match in pattern.finditer(content):
                      line = content.count('\n', 0, match.start()) + 1
                      violations.append(f'{path}:{line}: {label}: {match.group(0)}')

          if violations:
              raise RuntimeError('Prefix validation failed:\n' + '\n'.join(violations))

          print('Prefix validation passed.')
          PY

      - name: Run PHP syntax checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -path './.git' -prune -o -path './.github' -prune -o -name '*.php' -print0)

      - name: Create WordPress.org package
        shell: bash
        run: |
          set -euo pipefail

          package_root="build/f10-captura-de-leads"
          package_zip="build/f10-captura-de-leads-v1.3.9-wordpress-org.zip"

          rm -rf build
          mkdir -p "$package_root"

          rsync -a ./ "$package_root/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='build/' \
            --exclude='.gitignore' \
            --exclude='README.md'

          find "$package_root" -type f -name '*.zip' -delete

          (
            cd build
            zip -q -r "$(basename "$package_zip")" "$(basename "$package_root")"
          )

          unzip -t "$package_zip"
          sha256sum "$package_zip" | tee build/SHA256SUMS.txt

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: f10-captura-de-leads-v1.3.9-wordpress-org
          path: |
            build/f10-captura-de-leads-v1.3.9-wordpress-org.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
